[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonic-reservoir"
version = "0.1.0"
description = "Leakage-safe benchmark and isolated photonic reservoir research tracks"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.scripts]
photonic-reservoir = "photonic_reservoir.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
